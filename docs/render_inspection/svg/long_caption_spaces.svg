<title id="title">D1 chart (North Indian) — Saint Mary Church in the Hollow of the White Hazel near the Rapid Whirlpool of the Church of Saint Tysilio of the Red Cave, Upper Settlement District, Anglesey</title>
<desc id="desc">1980-07-04 23:05:07.250000 America/Argentina/ComodRivadavia. Saint Mary Church in the Hollow of the White Hazel near the Rapid Whirlpool of the Church of Saint Tysilio of the Red Cave, Upper Settlement District, Anglesey. Lahiri (Chitrapaksha), true equinox · Whole Sign houses · Mean Node. Lagna in rashi 5 (Simha) at 13°47′. House 1, rashi 5 (Simha): Mars 5°30′, retrograde. House 2, rashi 6 (Kanya): Jupiter 5°15′, direct. House 3, rashi 7 (Tula): Saturn 5°30′, direct. House 4, rashi 8 (Vrishchika): Rahu 5°15′, retrograde. House 5, rashi 9 (Dhanu): empty. House 6, rashi 10 (Makara): empty. House 7, rashi 11 (Kumbha): empty. House 8, rashi 12 (Meena): empty. House 9, rashi 1 (Mesha): Sun 5°00′, direct. House 10, rashi 2 (Vrishabha): Moon 5°30′, direct; Ketu 5°15′, retrograde. House 11, rashi 3 (Mithuna): Mercury 5°15′, direct. House 12, rashi 4 (Karka): Venus 5°45′, direct.</desc>
