<title id="title">D1 chart (North Indian) — Jalandhar, Punjab, India</title>
<desc id="desc">1995-03-21 06:45 Asia/Kolkata. Jalandhar, Punjab, India. Lahiri (Chitrapaksha), true equinox · Whole Sign houses · Mean Node. Lagna in rashi 12 (Meena) at 9°47′. House 1, rashi 12 (Meena): Sun 6°09′, direct. House 2, rashi 1 (Mesha): Ketu 13°47′, retrograde. House 3, rashi 2 (Vrishabha): empty. House 4, rashi 3 (Mithuna): empty. House 5, rashi 4 (Karka): Mars 19°27′, retrograde. House 6, rashi 5 (Simha): empty. House 7, rashi 6 (Kanya): empty. House 8, rashi 7 (Tula): Moon 29°12′, direct; Rahu 13°47′, retrograde. House 9, rashi 8 (Vrishchika): Jupiter 21°23′, direct. House 10, rashi 9 (Dhanu): empty. House 11, rashi 10 (Makara): Venus 27°39′, direct. House 12, rashi 11 (Kumbha): Mercury 15°23′, direct; Saturn 23°02′, direct.</desc>
