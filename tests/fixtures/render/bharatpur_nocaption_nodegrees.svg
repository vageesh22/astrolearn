<title id="d1-title">D1 chart (North Indian)</title>
<desc id="d1-desc">Lagna in rashi 7 (Tula) at 13°11′. House 1, rashi 7 (Tula): Ketu 25°00′, retrograde. House 2, rashi 8 (Vrishchika): Sun 22°30′, direct. House 3, rashi 9 (Dhanu): Mercury 13°20′, direct; Venus 20°50′, direct. House 4, rashi 10 (Makara): empty. House 5, rashi 11 (Kumbha): empty. House 6, rashi 12 (Meena): Mars 1°45′, direct. House 7, rashi 1 (Mesha): Rahu 25°00′, retrograde. House 8, rashi 2 (Vrishabha): Moon 23°21′, direct. House 9, rashi 3 (Mithuna): Saturn 17°39′, retrograde. House 10, rashi 4 (Karka): empty. House 11, rashi 5 (Simha): Jupiter 23°55′, direct. House 12, rashi 6 (Kanya): empty.</desc>
