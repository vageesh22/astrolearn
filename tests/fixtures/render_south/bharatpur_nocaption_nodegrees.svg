<title id="d1-south-title">D1 chart (South Indian)</title>
<desc id="d1-south-desc">Lagna in rashi 7 (Tula), house 1, at 13°11′. Mesha (house 7): Rahu 25°00′, retrograde. Vrishabha (house 8): Moon 23°21′, direct. Mithuna (house 9): Saturn 17°39′, retrograde. Simha (house 11): Jupiter 23°55′, direct. Tula (house 1): Ketu 25°00′, retrograde. Vrishchika (house 2): Sun 22°30′, direct. Dhanu (house 3): Mercury 13°20′, direct; Venus 20°50′, direct. Meena (house 6): Mars 1°45′, direct.</desc>
